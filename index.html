<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firemag</title>
    <style>
        body {
            background: #0f1724;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, sans-serif;
            flex-direction: column;
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.15);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .error {
            color: #f87171;
            display: none;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="spinner" id="spinner"></div>
    <p id="status">Загрузка Firemag...</p>
    <p class="error" id="error">⚠️ Не удалось загрузить страницу</p>
    <button class="btn" id="retryBtn" style="display:none;">Повторить</button>

    <script>
        const SITE_URL = 'https://an-core.github.io/frmfr_image/images/store/index.html';

        async function checkSite() {
            try {
                const response = await fetch(SITE_URL, { method: 'HEAD' });
                return response.ok;
            } catch {
                return false;
            }
        }

        function goToSite() {
            window.location.href = SITE_URL;
        }

        async function load() {
            const status = document.getElementById('status');
            const spinner = document.getElementById('spinner');
            const error = document.getElementById('error');
            const retryBtn = document.getElementById('retryBtn');

            status.textContent = 'Проверка соединения...';

            const isAvailable = await checkSite();

            if (isAvailable) {
                status.textContent = 'Сейчас сайт откроется, подождите...';
                setTimeout(goToSite, 500);
            } else {
                spinner.style.display = 'none';
                status.textContent = '';
                error.style.display = 'block';
                retryBtn.style.display = 'inline-block';
                retryBtn.addEventListener('click', function() {
                    window.location.reload();
                });
            }
        }

        load();
    </script>
</body>
</html>
